<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro dell’esplorazione</title>
<meta name="theme-color" content="#15181d">

<style>
/* Caratteri ospitati nel sito (licenza SIL OFL, vedi fonts/). Nessuna richiesta a Google. */
@font-face{font-family:"IM Fell English SC";src:url("fonts/im-fell-english-sc-400.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url("fonts/alegreya-sans-400.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url("fonts/alegreya-sans-400-italic.woff") format("woff");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url("fonts/alegreya-sans-500.woff") format("woff");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url("fonts/alegreya-sans-700.woff") format("woff");font-weight:700;font-style:normal;font-display:swap}
</style>
<style>
/* Layout: una colonna centrata; schede giocatori in alto, poi tracciato dei 6 livelli, stanza attiva, scelte della prossima mossa, registro. Tema scuro voluto (pietra e torcia). */
:root{
  --stone:#15181d; --slab:#1f242b; --slab2:#282e37; --line:#39404b;
  --parch:#ece3cf; --muted:#a69d8b; --torch:#dba24c; --torch-ink:#1a1408;
  --forza:#c95a40; --sapienza:#5b8fd0; --neutrale:#94a07f;
  --display:"IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--stone);color:var(--parch);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  background-image:radial-gradient(ellipse 80% 40% at 50% -10%, rgba(219,162,76,.10), transparent 70%)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem;line-height:1.1}
h2{font-size:1.3rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.hint{color:var(--muted);margin:0;font-size:.92rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--torch);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:22px}
.top .brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.logo{flex:none;width:68px;height:68px;border-radius:50%;background:var(--parch);display:grid;place-items:center;box-shadow:0 0 0 2px var(--line),0 0 24px rgba(219,162,76,.18)}
.logo img{width:80%;height:80%;object-fit:contain}
@media (max-width:480px){.logo{width:54px;height:54px}h1{font-size:1.55rem}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--slab);border-radius:8px;padding:9px 14px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--muted);background:var(--slab2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--torch);border-color:var(--torch);color:var(--torch-ink);font-weight:700}
.btn.primary:hover:not(:disabled){background:#e8b25f;border-color:#e8b25f}
.btn.big{padding:13px 20px;font-size:1.05rem}
.btn.ghost{background:transparent}
.btn.danger{border-color:#7a3a2e}

.panel{background:var(--slab);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}

/* setup */
.names{display:flex;flex-direction:column;gap:10px}
.name-row{display:flex;gap:8px;align-items:center}
.name-row .num{font-family:var(--display);color:var(--torch);width:1.6em;text-align:center;font-size:1.2rem}
.name-row input{flex:1;min-width:0;background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--parch);font:inherit}
.mods{display:flex;flex-direction:column;gap:8px}
.mod{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--stone);cursor:pointer}
.mod:has(input:checked){border-color:var(--torch)}
.mod input{accent-color:var(--torch);margin-top:5px}
.mod .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.mod strong{font-family:var(--display);font-weight:400;font-size:1.1rem}
.mod small{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:#f08a73;margin:0;font-size:.92rem}
details.fmt summary{cursor:pointer;color:var(--muted);font-size:.92rem}
details.fmt pre{background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-size:.8rem;line-height:1.4;color:var(--muted)}

a.btn{text-decoration:none;display:inline-flex;align-items:center}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--parch)}
.foot{display:flex;justify-content:center;padding-top:8px;font-size:.9rem}
.versione{margin:-6px 0 0;text-align:center;color:var(--muted);font-size:.78rem;opacity:.8}
.field{width:100%;background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--parch);font:inherit}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;margin-top:8px}
.narrow{max-width:420px}
.okmsg{color:var(--neutrale);margin:0;font-size:.92rem}
.mod .row{flex:none}
@media (max-width:520px){div.mod{flex-direction:column}}

.sym{display:inline-grid;place-items:center;min-width:1.35em;height:1.35em;padding:0 .2em;border-radius:50%;background:var(--parch);color:var(--stone);font-size:.78em;font-weight:700;vertical-align:.08em;margin:0 .06em}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tab{text-align:left;border:1px solid var(--line);background:var(--slab);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tab[aria-selected="true"]{border-color:var(--torch);background:var(--slab2);box-shadow:0 0 0 1px var(--torch) inset}
.tab .tn{font-weight:700;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .ts{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--line));flex:none}

/* i colori delle vie (.p-<via>) vengono dal file dell'esplorazione */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 55%,transparent);border-radius:999px;padding:2px 9px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc)}

/* track */
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.track{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.slot{flex:0 0 clamp(68px,17%,140px);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:78px;display:flex;flex-direction:column;gap:4px;background:var(--stone);text-align:left;min-width:0}
.slot .lv{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.slot .rt{font-size:.88rem;line-height:1.25;overflow-wrap:anywhere}
.slot.done{border-color:color-mix(in srgb,var(--pc) 60%,var(--line));background:color-mix(in srgb,var(--pc) 12%,var(--stone))}
.slot.done .rt{color:var(--parch)}
.slot.viewing{box-shadow:0 0 0 2px var(--pc) inset}
.slot.next{border-style:dashed;border-color:var(--torch)}
.slot.next .rt{color:var(--torch)}
.slot.empty .rt{color:var(--line)}

/* room */
.room{position:relative;background:var(--slab);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.room::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 90% at 0% 0%, color-mix(in srgb,var(--pc,var(--torch)) 16%,transparent), transparent 70%)}
.room > *{position:relative}
.room h3{font-size:1.75rem;line-height:1.15}
.room .content{max-width:65ch;margin:0}
.room.reveal .content,.room.reveal h3{animation:reveal .7s ease-out both}
.room.reveal h3{animation-duration:.45s}
@keyframes reveal{from{opacity:.0;filter:blur(6px);transform:translateY(4px)}to{opacity:1;filter:none;transform:none}}
.room.intro{--pc:var(--torch)}

/* offer */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--stone);border-radius:10px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:110px;transition:border-color .15s,background .15s,transform .15s}
.card:hover{border-color:var(--pc)}
.card[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--stone));transform:translateY(-2px)}
.card .ct{font-family:var(--display);font-size:1.25rem;line-height:1.2}
.card .badge{align-self:flex-start;margin-top:auto}
.note{border:1px dashed var(--torch);color:var(--torch);border-radius:8px;padding:10px 12px;margin:0;font-size:.95rem}
.enter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.enter-bar .sel{color:var(--muted);min-width:0}

/* log */
details.log summary{cursor:pointer;font-family:var(--display);font-size:1.15rem}
.log ol{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:flex;gap:10px;align-items:baseline;font-size:.92rem;border-bottom:1px solid var(--line);padding-bottom:6px;flex-wrap:wrap}
.log .n{color:var(--muted);font-variant-numeric:tabular-nums;width:2.2em}
.log .who{font-weight:700}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,9,11,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal .box{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal .box p{margin:0;color:var(--muted)}
.modal .mact{display:flex;flex-direction:column;gap:8px}
@media (min-width:480px){.modal .mact{flex-direction:row;flex-wrap:wrap;justify-content:flex-end}}


/* ---------- telefono ---------- */
button,a,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.room{scroll-margin-top:12px}
@media (max-width:640px){
  body{font-size:15px}
  .wrap{gap:14px}
  .top{padding-top:14px;gap:10px}
  .top .actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .top .actions .btn{padding:8px 10px;font-size:.92rem;justify-content:center;text-align:center}
  .panel{padding:14px;gap:12px}
  h2{font-size:1.15rem}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .tab{padding:8px 10px}
  .tab .tn{font-size:1rem}
  .tab .ts{font-size:.8rem}
  .track{gap:4px}
  .slot{padding:6px 5px;min-height:64px;gap:2px}
  .slot .lv{font-size:.62rem;letter-spacing:.06em}
  .slot .rt{font-size:.74rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
  .room{padding:16px;gap:8px}
  .room h3{font-size:1.45rem}
  .cards{grid-template-columns:1fr;gap:8px}
  .card{flex-direction:row;align-items:center;justify-content:space-between;min-height:0;padding:12px 14px;gap:10px}
  .card .ct{font-size:1.1rem;min-width:0}
  .card .badge{margin-top:0;align-self:center;flex:none}
  .card[aria-pressed="true"]{transform:none}
  .enter-bar{position:sticky;bottom:0;z-index:5;margin:0 -14px -14px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb,var(--slab) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-top:1px solid var(--line);border-radius:0 0 12px 12px;flex-wrap:nowrap}
  .enter-bar .sel{font-size:.88rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .enter-bar .btn.big{padding:11px 16px;font-size:1rem;flex:none}
}


/* regole */
.rules-box{max-width:620px;max-height:min(80vh,720px);overflow:hidden;padding:0;gap:0}
.rules-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.rules-head h2{min-width:0}
.rules-body{overflow-y:auto;padding:4px 20px 20px;overscroll-behavior:contain}
.rules-img{display:block;margin:14px auto 2px;max-height:170px;width:auto;max-width:100%}
.rules-body h3{font-size:1.15rem;color:var(--torch);margin:18px 0 6px}
.rules-body p{margin:8px 0;max-width:65ch}
.rules-body ul{margin:6px 0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.rules-body ul ul{margin-top:5px}
.rules-body strong{color:var(--parch)}
.rules-body .rules-link{margin-top:14px}
@media (max-width:640px){
  .top .actions.three{grid-template-columns:1fr 1fr 1fr}
  .top .actions .long,.slot .slot-long{display:none}
  .slot.next .rt{font-size:.68rem;overflow-wrap:normal}
  #rules.modal{padding:0;align-items:flex-end}
  .rules-box{max-height:88vh;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}


/* simulatore */
.simform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.simform label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.simsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:6px}
.simsum div{background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.simsum strong{font-size:1.3rem;font-variant-numeric:tabular-nums}
.simwarn{border:1px dashed var(--torch);border-radius:8px;padding:10px 14px;color:var(--parch)}
.simwarn strong{color:var(--torch)}
.simwarn ul{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.simh{font-size:1.1rem;margin-top:8px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.simt{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.simt th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.simt td{padding:6px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:middle}
.simt .num{text-align:right;white-space:nowrap}
.simt tr.bad td{color:#f08a73}
.simt tr.warnrow td{color:var(--torch)}
details.simlv{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--stone)}
details.simlv summary{cursor:pointer;font-weight:500}
details.simlv .tablewrap{margin-top:8px}
#sim-out{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<style>
/* ---------- sessioni (fase 3) ---------- */
.banner{margin:0;border:1px dashed var(--torch);color:var(--parch);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.banner.err{border-color:#f08a73;color:#f8c4b6}
.btn.small{padding:4px 10px;font-size:.88rem}
.btn.soft-disabled{opacity:.45}
.link.plain{background:none;border:0;padding:0;font:inherit;cursor:pointer}
.code-field{flex:1;min-width:0;max-width:220px;text-transform:uppercase;letter-spacing:.12em;font-size:1.15rem}
.sessione-info{margin:-8px 0 0;color:var(--muted);font-size:.92rem;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.sessione-info strong{color:var(--parch);letter-spacing:.06em}
.tab .tu{font-weight:400;color:var(--torch);font-size:.85em}
.codice-box{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.qr{flex:none;width:min(220px,60vw);aspect-ratio:1;background:#fff;border-radius:10px;padding:6px}
.qr svg{width:100%;height:100%;display:block}
.qr svg path,.qr svg rect{shape-rendering:crispEdges}
.codice-txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.codice-grande{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,9vw,3.4rem);letter-spacing:.08em;color:var(--torch);line-height:1}
details.master-code summary{cursor:pointer;color:var(--muted);font-size:.92rem}
details.master-code code{display:block;word-break:break-all;user-select:all;background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--parch)}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.seat{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:2px 10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--stone);border-radius:10px;padding:14px}
.seat .num{grid-row:1/3;font-family:var(--display);color:var(--torch);font-size:1.4rem;width:1.6em;text-align:center}
.seat .sn{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.seat:hover:not(:disabled){border-color:var(--torch)}
.seat:disabled{opacity:.45;cursor:not-allowed}
.seats-admin{display:flex;flex-direction:column;gap:6px}
.seat-row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.seat-row .num{grid-row:1/3;font-family:var(--display);color:var(--torch);width:1.6em;text-align:center}
.seat-row .sn{font-weight:700}
.seat-row .hint{grid-column:2}
.seat-row .row{grid-row:1/3;grid-column:3;justify-content:flex-end}
.fine-row{margin-top:4px}
.per-chi{margin:0;border-left:3px solid var(--torch);padding:6px 10px;background:color-mix(in srgb,var(--torch) 10%,transparent);border-radius:0 8px 8px 0}
.per-chi strong{color:var(--torch)}
.card:disabled{cursor:default;opacity:.8}
.card:disabled:hover{border-color:var(--line)}
.tablewrap{overflow-x:auto}
.simt{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.simt th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;padding:6px 8px;border-bottom:1px solid var(--line)}
.simt td{padding:6px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.simt .num{text-align:right}
.numero{display:flex;gap:8px}
.numero .btn{min-width:64px;font-size:1.2rem}
.tab .tu.guest{color:var(--muted)}
.identita .scelte-id .btn{flex:1 1 auto}
.nick-list{display:flex;flex-wrap:wrap;gap:8px}
.nuovo-nick{display:flex;flex-direction:column;gap:10px}
.disclaimer{margin:0;border-left:3px solid var(--torch);padding:6px 10px;background:color-mix(in srgb,var(--torch) 10%,transparent);border-radius:0 8px 8px 0}
.check{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.check input{margin-top:3px;width:20px;height:20px;accent-color:var(--torch);flex:none}
.id-riga{margin:0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--muted);font-size:.92rem}
@media (max-width:640px){
  .seat-row{grid-template-columns:auto 1fr}
  .seat-row .row{grid-row:auto;grid-column:2;justify-content:flex-start}
  .codice-box{flex-direction:column;align-items:flex-start}

const rich = s => esc(s).replace(/\n/g,'<br>').replace(/\{([A-Z0-9/]{1,3})\}/g,'<span class="sym">$1</span>');
const brand = (eyebrow,title) => `<div class="brand"><span class="logo"><img src="${LOGO_DATI}" alt="Logo Artenaut*"></span><div class="brand-txt"><span class="eyebrow">${esc(eyebrow)}</span><h1>${esc(title)}</h1></div></div>`;
const via = id => S?.esplorazione.vie.find(v=>v.id===id) || UI.modulo?.vie?.find(v=>v.id===id);
const badge = p => `<span class="badge p-${esc(p)}">${esc(via(p)?.breve||p)}</span>`;
const etichettaPasso = (passo, livello) => livello ? `Passo ${passo} · ${livello}` : `Passo ${passo}`;
const codiceValido = c => /^[A-Za-z]{3}-?\d{3}$/.test(c.trim());
const normalizzaCodice = c => { const t=c.trim().toUpperCase().replace(/\s+/g,''); return t.includes('-') ? t : t.slice(0,3)+'-'+t.slice(3); };
const link = c => `${location.origin}${location.pathname}?partita=${c}`;

function applicaColori(vie){
  let el = document.getElementById('path-colors');
  if(!el){ el = document.createElement('style'); el.id='path-colors'; document.head.appendChild(el); }
  el.textContent = (vie||[]).map(v=>`.p-${v.id}{--pc:${v.colore}}`).join('\n');
}

function qrSvg(testo){
  const q = qrcode(0, 'M'); q.addData(testo); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true, alt: 'QR code per entrare nella partita' });
}

/* ---------- collegamento al server ---------- */
let ws = null, timerRiconnessione = null, timerPing = null, tentativi = 0;
const ATTESE = [1, 2, 5, 10, 30];

function manda(m){ if(ws && ws.readyState===1) ws.send(JSON.stringify(m)); }

function chiudiConnessione(){
  clearTimeout(timerRiconnessione); clearInterval(timerPing);
  if(ws){ ws.onclose = null; try{ ws.close(); }catch(e){} ws = null; }
  UI.connesso = false;
}

function collega(){
  chiudiConnessione();
  if(!sessione) return;
  const s = sessione;
  const sock = new WebSocket(`${WS_SERVER}/api/partite/${encodeURIComponent(s.codice)}/ws`);
  ws = sock;
  sock.onopen = () => {
    tentativi = 0;
    const m = { tipo:'entra' };
    if(s.codiceMaster) m.codiceMaster = s.codiceMaster;
    else if(s.gettone) m.gettone = s.gettone;
    else if(s.ruolo==='tabellone') m.ruolo = 'tabellone';
    manda(m);
    timerPing = setInterval(()=>{ if(sock.readyState===1) sock.send('ping'); }, 30000);
  };
  sock.onmessage = e => { if(e.data==='pong') return; try{ ricevi(JSON.parse(e.data)); }catch(err){ console.error(err); } };
  sock.onclose = e => {
    clearInterval(timerPing);
    if(ws!==sock) return;
    ws = null; UI.connesso = false; UI.inviando = false;
    if(e.code===4404 || e.code===4000 || !sessione){ render(); return; }
    // riconnessione con calma: 1, 2, 5, 10 secondi, poi ogni 30
    timerRiconnessione = setTimeout(collega, ATTESE[Math.min(tentativi++, ATTESE.length-1)]*1000);
    render();
  };
}

// telefono che torna dallo standby: si ricollega subito
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && sessione && !ws){ tentativi = 0; collega(); }
  tieniAcceso();
});

function ricevi(m){
  switch(m.tipo){
    case 'benvenuto':
      ruolo = m.ruolo; mioPosto = m.posto; UI.connesso = true;
      controllaVersione(m.versione);
      aggiornaStato(m.stato);
      if(ruolo==='ospite'){ UI.schermata = 'posto'; }
      else {
        UI.schermata = 'gioco';
        if(ruolo==='esplorator') UI.sel = mioPosto;
        if(sessione.ruolo!==ruolo) salvaSessione({ ...sessione, ruolo });
      }
      break;
    case 'stato': aggiornaStato(m.stato); break;
    case 'mossa': {
      aggiornaStato(m.stato);
      if(m.posto===UI.sel){ UI.scelta = null; UI.rivelata = { posto:m.posto, stanza:m.stanza, versione:m.stato.posti[m.posto].versione }; }
      UI.inviando = false;
      render(); scorriAllaStanza(); return;
    }
    case 'annullata':
      aggiornaStato(m.stato);
      if(UI.rivelata?.posto===m.posto) UI.rivelata = null;
      if(m.posto===UI.sel) UI.scelta = null;
      UI.inviando = false;
      break;
    case 'posto':
      salvaSessione({ codice:sessione.codice, ruolo:'esplorator', gettone:m.gettone, posto:m.posto });
      ruolo = 'esplorator'; mioPosto = m.posto; UI.sel = m.posto; UI.schermata = 'gioco';
      break;
    case 'liberato':
      salvaSessione({ codice:sessione.codice, ruolo:'ospite' });
      ruolo = 'ospite'; mioPosto = null; UI.schermata = 'posto'; UI.avviso = m.messaggio;
      break;
    case 'nickname': UI.nicknames = m.elenco || []; break;
    case 'chiusa': return partitaChiusa(m);
    case 'errore': return erroreServer(m);
  }
  render();
}

function aggiornaStato(stato){
  S = stato;
  applicaColori(S.esplorazione.vie);
  if(UI.sel >= S.posti.length) UI.sel = 0;
  const r = UI.rivelata;
  if(r && S.posti[r.posto]?.versione !== r.versione) UI.rivelata = null;
  if(UI.scelta && !S.posti[UI.sel]?.proposte.some(x=>x.id===UI.scelta)) UI.scelta = null;
}

function erroreServer(m){
  UI.inviando = false;
  switch(m.codice){
    case 'partita-inesistente': case 'partita-piu-nuova':
      dimentica(); UI.errore = m.messaggio; UI.schermata = 'home'; break;
    case 'gettone-non-valido':
      // il posto è stato liberato mentre il telefono era spento: si sceglie di nuovo
      salvaSessione({ codice:sessione.codice, ruolo:'ospite' }); UI.avviso = m.messaggio; manda({ tipo:'entra' }); break;
    case 'codice-master-errato':
      salvaSessione({ codice:sessione.codice, ruolo:'ospite' }); UI.errore = m.messaggio; manda({ tipo:'entra' }); break;
    case 'versione-superata': case 'stanza-non-proposta':
      if(m.stato) aggiornaStato(m.stato);
      UI.scelta = null; UI.avviso = m.messaggio; break;
    default:
      UI.avviso = m.messaggio || 'Qualcosa non ha funzionato.';
  }
  render();
}

function partitaChiusa(m){
  const n = m.nuova;
  chiudiConnessione();
  if(n){
    // stesso gruppo: si entra subito nella nuova partita, con lo stesso posto
    if(n.codiceMaster) salvaSessione({ codice:n.codice, ruolo:'master', codiceMaster:n.codiceMaster });
    else if(n.gettone) salvaSessione({ codice:n.codice, ruolo:'esplorator', gettone:n.gettone, posto:n.posto });
    else salvaSessione({ codice:n.codice, ruolo: ruolo==='tabellone' ? 'tabellone' : 'ospite' });
    S = null; UI.rivelata = null; UI.scelta = null; UI.gestione = false; UI.qr = !!n.codiceMaster;
    UI.avviso = `${m.modo==='chiusa' ? 'Partita chiusa' : 'Partita annullata'}: si riparte con lo stesso gruppo nella partita ${n.codice}.`;
    if(m.riepilogo) mostraRiepilogo(m.riepilogo);
    UI.schermata = 'collegamento';
    render(); collega();
    return;
  }
  dimentica();
  UI.fine = m; UI.schermata = 'fine';
  render();
}

function dimentica(){ chiudiConnessione(); salvaSessione(null); S = null; ruolo = null; mioPosto = null; UI.rivelata = null; UI.scelta = null; UI.gestione = false; UI.qr = false; }

function mostraRiepilogo(r){
  const righe = r.posti.filter(p=>p.tipo).map(p=>`${p.nome}${p.tipo==='guest'?' (guest)':''}: ${p.cicli} ${p.cicli===1?'ciclo completato':'cicli completati'}, ${p.stanze} ${p.stanze===1?'stanza':'stanze'}`).join(' · ');
  ask({ title:'Partita chiusa', body:righe, actions:[{ label:'Continua', cls:'primary' }] });
}

let wakeLock = null;

  if(UI.schermata!=='gioco' || document.visibilityState!=='visible' || wakeLock || !('wakeLock' in navigator)) return;
  try{ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); }catch(e){ wakeLock=null; }

/* ---------- regole dell'esplorazione ---------- */
function rulesHtml(src){
  const lines=String(src||'').split('\n'); let out='', stack=[];
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\{([A-Z0-9/]{1,3})\}/g,'<span class="sym">$1</span>');
  const closeTo=d=>{ while(stack.length>d){ out+='</li></ul>'; stack.pop(); } };
  for(const raw of lines){
    const m=raw.match(/^(\s*)- (.*)$/);
    if(m){
      const d=Math.min(Math.floor(m[1].length/2),3)+1;
      if(stack.length<d){ while(stack.length<d){ out+='<ul><li>'; stack.push(1); } }
      else { closeTo(d); out+='</li><li>'; }
      out+=inline(m[2]); continue;
    }
    closeTo(0);
    const h=raw.match(/^## (.*)$/);
    if(h) out+=`<h3>${inline(h[1])}</h3>`;
    else if(raw.trim()) out+=`<p>${inline(raw.trim())}</p>`;
  }
  closeTo(0); return out;
}
const rulesEl = document.getElementById('rules');
function openRules(e){
  if(!e) return;
  document.getElementById('r-title').textContent = 'Regole dell’esplorazione';
  const body = document.getElementById('r-body');
  body.innerHTML = (e.regoleImmagine ? `<img class="rules-img" src="${esc(e.regoleImmagine)}" alt="Astronauta che esplora con una torcia">` : '')
    + (e.regole ? rulesHtml(e.regole) : '<p class="hint">Questa esplorazione non ha ancora le regole.</p>');
  if(e.regoleLink) body.insertAdjacentHTML('beforeend', `<p class="rules-link"><a class="link" href="${esc(e.regoleLink)}" target="_blank" rel="noopener">Regolamento completo</a></p>`);
  body.scrollTop = 0; rulesEl.hidden = false; document.getElementById('r-close').focus();
}
function closeRules(){ rulesEl.hidden = true; }
document.getElementById('r-close').onclick = closeRules;
rulesEl.addEventListener('click', e=>{ if(e.target===rulesEl) closeRules(); });

async function entraConCodice(testo){
  UI.errore = ''; UI.avviso = '';
  if(!codiceValido(testo)){ UI.errore = 'Il codice è fatto di tre lettere e tre numeri, per esempio LWR-482.'; render(); return; }
  const codice = normalizzaCodice(testo);
  // stesso telefono che rientra in una partita lasciata con «Esci»: ritrova il posto
  const ultimo = store.get('esplorazione.ultimoPosto');
  if(ultimo?.codice===codice){ salvaSessione(ultimo); store.set('esplorazione.ultimoPosto', null); UI.schermata='collegamento'; render(); collega(); return; }
  UI.schermata = 'collegamento'; render();
  try{
    const r = await fetch(`${SERVER}/api/partite/${encodeURIComponent(codice)}`);
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ UI.errore = j.errore || 'Non riesco a trovare la partita. Riprova.'; UI.schermata='home'; render(); return; }
  }catch(e){ UI.errore = 'Il server non risponde. Controlla la connessione e riprova.'; UI.schermata='home'; render(); return; }
  salvaSessione({ codice, ruolo:'ospite' });
  collega();
}

/* ---------- versione (V.6) ----------
   Il server dice la sua versione all'ingresso nella partita e in /api/stato. Se è diversa da quella
   dell'app, compare un avviso con il pulsante «Ricarica»: mai ricarica automatica (decisione del 13/11/2026). */
function controllaVersione(v){
  if(typeof v!=='string' || v===VERSIONE || UI.nuovaVersione) return;
  UI.nuovaVersione = true; render();
}
fetch(`${SERVER}/api/stato`).then(r=>r.ok ? r.json() : null).then(j=>controllaVersione(j?.versione)).catch(()=>{});

async function caricaEsplorazioni(){
  if(UI.esplorazioni) return;
  try{
    const r = await fetch(`${SERVER}/api/esplorazioni`);
    if(!r.ok) throw new Error();
    UI.esplorazioni = await r.json();
    applicaColori(UI.esplorazioni.flatMap(e=>e.vie));
    if(!UI.esplorazioni.some(e=>e.id===UI.modulo?.id)) UI.modulo = UI.esplorazioni[0] || null;
  }catch(e){ UI.errore = 'Non riesco a scaricare l’elenco delle esplorazioni. Controlla la connessione e riprova.'; UI.esplorazioni = null; }
  if(UI.schermata==='crea') render();
}

async function creaPartita(){
  UI.inviando = true; render();
  try{
    const r = await fetch(`${SERVER}/api/partite`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ esplorazione: UI.modulo.id, posti: UI.numero }) });
    const j = await r.json().catch(()=>({}));
    UI.inviando = false;
    if(!r.ok){ UI.errore = j.errore || 'Non è stato possibile creare la partita. Riprova.'; render(); return; }
    UI.errore = ''; UI.qr = true; UI.sel = 0;
    salvaSessione({ codice:j.codice, ruolo:'master', codiceMaster:j.codiceMaster });
    UI.schermata = 'collegamento'; render(); collega();
  }catch(e){ UI.inviando = false; UI.errore = 'Il server non risponde. Controlla la connessione e riprova.'; render(); }
}

  const mf = document.getElementById('master-form');
  if(mf) mf.onsubmit = e=>{ e.preventDefault(); const c=document.getElementById('codice-master').value.trim(); if(!c) return;
    UI.masterInput=false; UI.errore=''; salvaSessione({ codice:sessione.codice, ruolo:'master', codiceMaster:c }); manda({ tipo:'entra', codiceMaster:c }); };
  document.getElementById('rules-btn').onclick = ()=>openRules(S.esplorazione);
  document.getElementById('esci').onclick = ()=>{ dimentica(); UI.schermata='home'; render(); };
}

function renderGioco(){
  if(!S){ renderCollegamento(); return; }
  const P = S.posti, sel = Math.min(UI.sel, P.length-1), p = P[sel];
  const master = ruolo==='master';
  const puoMuovere = master || (ruolo==='esplorator' && mioPosto===sel);
  const puoScegliereId = master || (ruolo==='esplorator' && mioPosto===sel);
  const sceltaId = puoScegliereId && (!p.identita || (UI.cambiaId===sel && p.mosse===0));
  const ultimo = p.percorso[p.percorso.length-1];
  const r = UI.rivelata;
  const mostraTesto = r && r.posto===sel && ultimo && r.stanza.id===ultimo.id;

  const tabs = P.map((q,i)=>{
    const cur = q.percorso[q.percorso.length-1];
    const dove = !cur ? 'All’ingresso' : q.completato ? 'Esplorazione completata' : `Passo ${q.percorso.length}`;
    const mio = ruolo==='esplorator' && mioPosto===i;
    return `<button class="tab ${cur?'p-'+cur.via:''}" role="tab" aria-selected="${i===sel}" data-tab="${i}">
      <span class="tn">${esc(q.nome)}${mio?' <span class="tu">(tu)</span>':''}${q.identita?.tipo==='guest'?' <span class="tu guest">guest</span>':''}</span><span class="ts"><span class="dot"></span>${dove} · giro ${q.giro}</span></button>`;
  }).join('');

  // solo i passi fatti e il prossimo: la lunghezza totale del percorso resta nascosta
  let slots = p.percorso.map((s,i)=>`<div class="slot done p-${esc(s.via)} ${i===p.percorso.length-1?'viewing':''}"><span class="lv">Passo ${i+1}</span><span class="rt">${esc(s.titolo)}</span></div>`).join('');
  if(!p.completato) slots += `<div class="slot next"><span class="lv">Passo ${p.passo}</span><span class="rt">Prossima<span class="slot-long"> mossa</span></span></div>`;

  const roomHtml = ultimo ? `
    <section class="room p-${esc(ultimo.via)} ${mostraTesto?'reveal':''}" aria-live="polite">
      <div class="row"><span class="eyebrow">Passo ${p.percorso.length}</span>${badge(ultimo.via)}</div>
      <h3>${esc(ultimo.titolo)}</h3>
      ${mostraTesto?`<p class="content">${rich(r.stanza.testo||'')}</p>`:`<p class="content hint">Stanza attuale di ${esc(p.nome)}. L’effetto si legge solo al momento dell’ingresso.</p>`}
    </section>` : `
    <section class="room intro">
      <span class="eyebrow">Giro ${p.giro}</span>
      <h3>${esc(p.nome)} è davanti all’ingresso</h3>
      <p class="content">Scegli quale via imboccare. Il contenuto di ogni stanza si rivela solo quando ci entri.</p>
      ${p.identita && puoScegliereId && p.mosse===0 && !sceltaId ? `<p class="id-riga">${p.identita.tipo==='guest' ? 'Gioca come guest, senza classifica.' : 'Nickname del club: entra in classifica.'}
        ${p.identita.tipo==='guest' ? '<button class="btn ghost small" id="altro-nome">Un altro nome</button>' : ''}
        <button class="link plain" id="cambia-id">Cambia</button></p>` : ''}
    </section>`;

  const scelta = p.proposte.find(x=>x.id===UI.scelta);
  const chiPuo = p.occupato ? `Può muovere ${esc(p.nome)} dal suo telefono, oppure il master.` : `${esc(p.nome)} non ha un telefono collegato: per lei o per lui muove il master.`;
  const offerHtml = sceltaId ? pannelloIdentita(sel) : !p.identita ? `
    <section class="panel"><h2>Chi gioca nel ${esc(p.nome)}?</h2>
      <p class="hint">${p.occupato ? 'In attesa che scelga il nickname dal suo telefono.' : 'Lo sceglie il telefono che occupa questo posto, oppure il master.'}</p></section>` : `
    <section class="panel">
      <div class="sec-head"><h2>Prossima mossa · ${esc(etichettaPasso(p.passo, p.livello))}</h2><span class="hint">${p.proposte.length} ${p.proposte.length===1?'stanza disponibile':'stanze tra cui scegliere'}</span></div>
      ${p.completato?`<p class="note">${esc(p.nome)} ha completato l’esplorazione. La prossima mossa riporta all’ingresso e apre il giro ${p.giro+1}.</p>`:''}
      ${master ? `<p class="per-chi">Stai muovendo per <strong>${esc(p.nome)}</strong></p>` : ''}
      <div class="cards">${p.proposte.map(s=>`<button class="card p-${esc(s.via)}" aria-pressed="${UI.scelta===s.id}" data-pick="${esc(s.id)}" ${puoMuovere?'':'disabled'}><span class="ct">${esc(s.titolo)}</span>${badge(s.via)}</button>`).join('')}</div>
      ${puoMuovere ? `<div class="enter-bar"><span class="sel">${scelta?`${master?`Per ${esc(p.nome)}: `:'Scelta: '}<strong>${esc(scelta.titolo)}</strong>`:'Seleziona una stanza.'}</span>
        <button class="btn primary big" id="enter" ${scelta && !UI.inviando && UI.connesso?'':'disabled'}>Entra nella stanza</button></div>`
        : `<p class="hint">${chiPuo}</p>`}
    </section>`;

  const reg = S.registro;
  const logHtml = `
    <details class="log panel"><summary>Registro delle mosse (${reg.length}${reg.length>=60?'+':''})</summary>
      ${reg.length?`<ol>${reg.map((e,i)=>`<li><span class="n">${reg.length-i}.</span><span class="who">${esc(e.nome)}</span><span>${esc(e.stanza)}</span>${badge(e.via)}<span class="hint">passo ${e.passo} · giro ${e.giro}${e.master?' · dal master':''}</span></li>`).join('')}</ol>`:'<p class="hint">Ancora nessuna mossa.</p>'}
    </details>`;

  const a = S.annullabile;
  const puoAnnullare = a && (master || (ruolo==='esplorator' && a.autore===mioPosto));
  const azioni = master ? `<button class="btn" id="gestisci" aria-expanded="${UI.gestione}">Gestisci</button>` : `<button class="btn ghost" id="esci">Esci</button>`;

  app.innerHTML = `
  <header class="top">
    ${brand(S.esplorazione.nome,'Registro dell’esplorazione')}
    <div class="actions three"><button class="btn" id="rules-btn">Regole</button><button class="btn ${puoAnnullare?'':'soft-disabled'}" id="undo">Annulla<span class="long"> ultima mossa</span></button>${azioni}</div>
  </header>
  ${!UI.connesso ? `<p class="banner err" role="status">Connessione persa: provo a ricollegarmi…</p>` : ''}
  ${avvisoHtml()}
  <p class="sessione-info"><span>Partita <strong>${esc(S.codice)}</strong> · ${ruolo==='master'?'master':ruolo==='tabellone'?'tabellone':ruolo==='esplorator'?`sei ${esc(P[mioPosto]?.nome||'')}`:''}</span>${master && !UI.qr && !UI.gestione ? ' <button class="link plain" id="mostra-qr">Mostra QR</button>' : ''}</p>
  ${master && (UI.qr || UI.gestione) ? pannelloCodice() : ''}
  ${master && UI.gestione ? pannelloGestione() : ''}
  <nav class="tabs" role="tablist" aria-label="Esplorator*">${tabs}</nav>
  <section class="panel">
    <div class="sec-head"><h2>Percorso di ${esc(p.nome)}</h2><span class="hint">Giro ${p.giro} · ${p.mosse} ${p.mosse===1?'mossa':'mosse'} in totale</span></div>
    <div class="track">${slots}</div>
  </section>
  ${roomHtml}
  ${offerHtml}
  ${logHtml}`;

  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ UI.sel=+b.dataset.tab; UI.scelta=null; if(UI.rivelata?.posto!==UI.sel) UI.rivelata=null; render(); });
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ UI.scelta = UI.scelta===b.dataset.pick?null:b.dataset.pick; render(); });
  if(sceltaId) legaIdentita(sel);
  const an = document.getElementById('altro-nome'); if(an) an.onclick = ()=>manda({ tipo:'identita', posto:sel, scelta:{ tipo:'guest' } });
  const ci = document.getElementById('cambia-id'); if(ci) ci.onclick = ()=>{ UI.cambiaId=sel; UI.nicknames=null; render(); };
  const en = document.getElementById('enter');
  if(en) en.onclick = ()=>{ if(!UI.scelta) return; UI.inviando = true; UI.avviso = ''; manda({ tipo:'mossa', posto:sel, stanza:UI.scelta, versione:p.versione }); render(); };
  document.getElementById('undo').onclick = chiediAnnulla;
  document.getElementById('rules-btn').onclick = ()=>openRules(S.esplorazione);
  const g = document.getElementById('gestisci'); if(g) g.onclick = ()=>{ UI.gestione=!UI.gestione; UI.qr=false; render(); };
  const mq = document.getElementById('mostra-qr'); if(mq) mq.onclick = ()=>{ UI.qr=true; render(); };
  const e = document.getElementById('esci'); if(e) e.onclick = chiediEsci;
  if(master) legaGestione();
}

/* ---------- chi gioca in un posto (fase 4) ---------- */
// l'elenco dei nickname non è pubblico: lo manda la partita a chi ha un posto o al master
function caricaNickname(){ manda({ tipo:'nickname' }); }

function pannelloIdentita(posto){
  const p = S.posti[posto], perAltri = ruolo==='master';
  if(UI.nicknames===null){ UI.nicknames = undefined; caricaNickname(); }
  const usati = new Set(S.posti.filter((q,i)=>i!==posto && q.identita?.tipo==='nickname').map(q=>q.identita.id));
  const lista = (UI.nicknames||[]).filter(n=>!usati.has(n.id));
  const filtro = UI.cerca.trim().toLowerCase();
  const visibili = filtro ? lista.filter(n=>n.nickname.toLowerCase().includes(filtro)) : lista;
  const elenco = UI.nicknames===undefined || UI.nicknames===null ? '<p class="hint">Caricamento dei nickname…</p>' : `
      ${lista.length>8?`<input id="cerca-nick" class="field" placeholder="Cerca il nickname" value="${esc(UI.cerca)}" autocomplete="off" aria-label="Cerca il nickname">`:''}
      <div class="nick-list">${visibili.slice(0,40).map(n=>`<button class="btn" data-nick="${n.id}">${esc(n.nickname)}</button>`).join('') || '<p class="hint">Nessun nickname trovato.</p>'}</div>
      <p class="hint">Non c’è? <button class="link plain" data-idtab="nuovo">Crea un nuovo nickname</button>.</p>`;
  const nuovo = `
      <form id="nuovo-nick" class="nuovo-nick">
        ${perAltri?'<p class="note">Il nickname lo crea la persona che giocherà: passale il telefono, perché le due caselle valgono come sua dichiarazione.</p>':''}
        <input id="nick" class="field" maxlength="20" placeholder="Nickname (da 3 a 20 caratteri)" autocomplete="off" spellcheck="false" aria-label="Nuovo nickname">
        <p class="disclaimer">Il nickname sarà visibile a chiunque nella classifica pubblica. <strong>Non usare il tuo nome vero.</strong></p>
        <label class="check"><input type="checkbox" id="eta14"><span>Ho almeno 14 anni.</span></label>
        <label class="check"><input type="checkbox" id="consenso"><span>Acconsento a comparire con questo nickname nella classifica pubblica del club. <a class="link" href="informativa.html" target="_blank" rel="noopener">Leggi l’informativa</a></span></label>
        <div><button class="btn primary" type="submit">Crea il nickname e gioca</button></div>
        <p class="hint">Preferisci non comparire in classifica? Gioca come guest. Se hai meno di 14 anni, gioca come guest.</p>
      </form>`;
  return `
  <section class="panel identita">
    <div><h2>${perAltri ? `Chi gioca nel posto di ${esc(p.nome)}?` : 'Chi sei?'}</h2>
      <p class="hint">Scegli un nickname del club per entrare in classifica, oppure gioca come guest: niente classifica e nessun dato salvato.</p></div>
    <div class="row scelte-id">
      <button class="btn ${UI.idTab==='elenco'?'primary':''}" data-idtab="elenco">Nickname del club</button>
      <button class="btn ${UI.idTab==='nuovo'?'primary':''}" data-idtab="nuovo">Nuovo nickname</button>
      <button class="btn" id="come-guest">Gioca come guest</button>
    </div>
    ${UI.idTab==='nuovo' ? nuovo : elenco}
    ${p.identita ? '<div><button class="btn ghost small" id="annulla-cambio">Lascia com’era</button></div>' : ''}
  </section>`;
}

function legaIdentita(posto){
  const sceglie = scelta => { UI.cambiaId = null; UI.avviso = ''; manda({ tipo:'identita', posto, scelta }); };
  app.querySelectorAll('[data-idtab]').forEach(b=>b.onclick=()=>{ UI.idTab=b.dataset.idtab; render(); if(UI.idTab==='nuovo') document.getElementById('nick')?.focus(); });
  app.querySelectorAll('[data-nick]').forEach(b=>b.onclick=()=>sceglie({ tipo:'nickname', id:+b.dataset.nick }));
  document.getElementById('come-guest').onclick = ()=>sceglie({ tipo:'guest' });
  const c = document.getElementById('cerca-nick');
  if(c) c.oninput = e=>{ UI.cerca = e.target.value; render(); const n=document.getElementById('cerca-nick'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  const ac = document.getElementById('annulla-cambio'); if(ac) ac.onclick = ()=>{ UI.cambiaId=null; render(); };
  const f = document.getElementById('nuovo-nick');
  if(f) f.onsubmit = e=>{
    e.preventDefault();
    const nick = document.getElementById('nick').value.trim(), eta14 = document.getElementById('eta14').checked, consenso = document.getElementById('consenso').checked;
    if(nick.length<3){ UI.avviso = 'Il nickname deve avere almeno 3 caratteri.'; render(); return; }
    if(!eta14 || !consenso){ UI.avviso = 'Per comparire in classifica servono entrambe le caselle. Altrimenti puoi giocare come guest.'; render(); document.getElementById('nick').value = nick; return; }
    UI.nicknames = null; // dopo la creazione l'elenco va riscaricato
    sceglie({ tipo:'nuovo', nickname:nick, eta14, consenso });
  };
}

function pannelloCodice(){
  const l = link(S.codice);
  return `
  <section class="panel codice-panel">
    <div class="codice-box">
      <div class="qr">${qrSvg(l)}</div>
      <div class="codice-txt">
        <span class="eyebrow">Codice della partita</span>
        <strong class="codice-grande">${esc(S.codice)}</strong>
        <p class="hint">Gli altri telefoni inquadrano il QR code, oppure aprono l’app e scrivono il codice.</p>
        ${UI.qr && !UI.gestione ? `<div><button class="btn ghost" id="nascondi-qr">Nascondi</button></div>` : ''}
      </div>
    </div>
    <details class="master-code"><summary>Codice master</summary>
      <p class="hint">Serve per riprendere il ruolo di master da un altro dispositivo, se questo si spegne. Non condividerlo con chi gioca.</p>
      <code class="mono" id="cm">${esc(sessione?.codiceMaster||'')}</code>
    </details>
  </section>`;
}

function pannelloGestione(){
  const P = S.posti;
  return `
  <section class="panel">
    <div><h2>Gestione della partita</h2><p class="hint">Come master puoi muovere per chiunque, scegliere il nickname di chi non ha il telefono, liberare un posto se qualcun* cambia telefono, aggiungere o togliere esplorator*.</p></div>
    <div class="seats-admin">${P.map((p,i)=>`
      <div class="seat-row"><span class="num">${ROMAN[i]}</span><span class="sn">${esc(p.nome)}</span>
        <span class="hint">${p.occupato?'Telefono collegato':'Senza telefono: muove il master'}${!p.identita?' · da scegliere':p.identita.tipo==='guest'?' · guest':''}</span>
        <span class="row">${p.occupato?`<button class="btn ghost small" data-libera="${i}">Libera il posto</button>`:''}${P.length>2?`<button class="btn ghost small" data-togli="${i}">Togli</button>`:''}</span>
      </div>`).join('')}
    </div>
    ${P.length<4?`<div><button class="btn" id="aggiungi-posto">Aggiungi un posto</button></div>`:''}
    <div class="row fine-row"><button class="btn primary" id="chiudi-partita">Chiudi partita</button><button class="btn danger" id="annulla-partita">Annulla partita</button></div>
    <p class="hint">«Chiudi partita» la conclude e ne conserva i risultati (in futuro per la classifica). «Annulla partita» la chiude senza salvare nulla. In entrambi i casi la partita viene eliminata dal server.</p>
    <div class="row"><button class="link plain" id="esci-master">Lascia la partita su questo dispositivo</button></div>
  </section>`;
}

function legaGestione(){
  const nq = document.getElementById('nascondi-qr'); if(nq) nq.onclick = ()=>{ UI.qr=false; render(); };
  if(!UI.gestione) return;
  app.querySelectorAll('[data-libera]').forEach(b=>b.onclick=()=>{ const p=S.posti[+b.dataset.libera];
    ask({ title:`Liberare il posto di ${p.nome}?`, body:'Il telefono che lo occupa non potrà più muovere per questo posto. Serve quando qualcun* cambia telefono: il nuovo telefono potrà sceglierlo.',
      actions:[{label:'Indietro',cls:'ghost'},{label:'Libera il posto',cls:'primary',fn:()=>manda({ tipo:'libera', posto:+b.dataset.libera })}] }); });
  app.querySelectorAll('[data-togli]').forEach(b=>b.onclick=()=>{ const p=S.posti[+b.dataset.togli];
    ask({ title:`Togliere ${p.nome} dalla partita?`, body:'Il suo percorso andrà perso. Dopo non si potrà annullare l’ultima mossa.',
      actions:[{label:'Indietro',cls:'ghost'},{label:'Togli',cls:'danger',fn:()=>manda({ tipo:'togli', posto:+b.dataset.togli })}] }); });
  const ap = document.getElementById('aggiungi-posto'); if(ap) ap.onclick = ()=>manda({ tipo:'aggiungi' });
  document.getElementById('chiudi-partita').onclick = ()=>chiediChiusura(true);
  document.getElementById('annulla-partita').onclick = ()=>chiediChiusura(false);
  document.getElementById('esci-master').onclick = ()=>ask({ title:'Lasciare la partita su questo dispositivo?',
    body:'La partita continua sul server. Per riprendere il ruolo di master da un altro dispositivo serve il codice master: copialo prima di uscire.',
    actions:[{label:'Indietro',cls:'ghost'},{label:'Esci',cls:'danger',fn:()=>{ dimentica(); UI.schermata='home'; render(); }}] });
}

function chiediChiusura(salva){
  ask({ title: salva ? 'Chiudere la partita?' : 'Annullare la partita?',
    body: salva ? 'La partita si conclude e i risultati vengono conservati. Poi potrai ripartire con lo stesso gruppo o tornare all’inizio.'
                : 'La partita viene chiusa senza salvare nulla: tutti i dati vengono eliminati.',
    actions:[ {label:'Indietro', cls:'ghost'},
      {label: salva ? 'Chiudi partita' : 'Annulla partita', cls: salva ? 'primary' : 'danger', fn:()=>{
        ask({ title:'Come proseguire?', body:'Con lo stesso gruppo si apre subito una nuova partita: i telefoni già collegati restano al loro posto.',
          actions:[ {label:'Torna all’inizio', cls:'ghost', fn:()=>manda({ tipo:'chiudi', salva, poi:'fine' })},
                    {label:'Stesso gruppo', cls:'primary', fn:()=>manda({ tipo:'chiudi', salva, poi:'stesso-gruppo' })} ] });
      }} ]});
}

function chiediAnnulla(){
  const a = S.annullabile;
  if(!a){ ask({ title:'Niente da annullare', body:'Si può annullare solo l’ultima mossa della partita, e al momento non ce n’è una.', actions:[{label:'Ok',cls:'primary'}] }); return; }
  const chi = a.autore==='master' ? 'il master' : (S.posti[a.autore]?.nome || '');
  const puo = ruolo==='master' || (ruolo==='esplorator' && a.autore===mioPosto);
  if(!puo){
    ask({ title:'Non puoi annullare', body:`Si può annullare solo l’ultima mossa della partita: l’ha fatta ${chi}, per ${a.nome}. Può annullarla solo chi l’ha fatta, oppure il master.`, actions:[{label:'Ok',cls:'primary'}] });
    return;
  }
  ask({ title:'Annullare l’ultima mossa?', body:`${a.nome} tornerà indietro da «${a.stanza}».`,
    actions:[ {label:'Non annullare', cls:'ghost'}, {label:'Annulla mossa', cls:'primary', fn:()=>{ UI.inviando=true; manda({ tipo:'annulla' }); }} ] });
}

function chiediEsci(){
  const testo = ruolo==='esplorator'
    ? 'Il posto resta occupato da questo telefono finché il master non lo libera. Potrai rientrare con il codice della partita.'
    : 'Potrai rientrare con il codice della partita.';
  ask({ title:'Uscire dalla partita?', body:testo, actions:[{label:'Indietro',cls:'ghost'},{label:'Esci',cls:'danger',fn:()=>{
    // chi ha un posto lo conserva: se rientra con lo stesso telefono, ritrova il posto
    if(ruolo==='esplorator'){ const s=sessione; chiudiConnessione(); S=null; store.set('esplorazione.ultimoPosto', s); salvaSessione(null); }
    else dimentica();
    UI.schermata='home'; render(); }}] });
}

function renderFine(){
  const m = UI.fine || {};
  const titolo = m.modo==='chiusa' ? 'Partita chiusa' : m.modo==='annullata' ? 'Partita annullata' : 'Partita scaduta';
  const testo = m.modo==='chiusa' ? 'La partita è conclusa.' : m.modo==='annullata' ? 'La partita è stata chiusa senza salvare nulla.' : (m.messaggio || 'La partita è scaduta e i suoi dati sono stati eliminati.');
  const r = m.riepilogo;
  app.innerHTML = `
  <header class="top">${brand('Artenaut* Magic Exploration Companion','Registro dell’esplorazione')}</header>
  <section class="panel">
    <div><h2>${titolo}</h2><p class="hint">${esc(testo)}</p></div>
    ${r ? `<div class="tablewrap"><table class="simt"><thead><tr><th>Esplorator*</th><th class="num">Cicli completati</th><th class="num">Stanze aperte</th></tr></thead>
      <tbody>${r.posti.filter(p=>p.tipo).map(p=>`<tr><td>${esc(p.nome)}${p.tipo==='guest'?' <span class="hint">(guest)</span>':''}</td><td class="num">${p.cicli}</td><td class="num">${p.stanze}</td></tr>`).join('')}</tbody></table></div>` : ''}
    <div><button class="btn primary big" id="inizio">Torna all’inizio</button></div>
  </section>`;
  document.getElementById('inizio').onclick = ()=>{ UI.fine=null; UI.schermata='home'; render(); };
}

/* ---------- avvio ---------- */
(function avvio(){
  const daLink = new URLSearchParams(location.search).get('partita');
  if(daLink){
    // tolgo il codice dall'indirizzo, così un ricaricamento non ripete l'ingresso
    const u = new URL(location.href); u.searchParams.delete('partita'); history.replaceState(null, '', u);
    const codice = codiceValido(daLink) ? normalizzaCodice(daLink) : null;
    if(codice && sessione?.codice===codice){ UI.schermata='collegamento'; render(); collega(); return; }
    if(codice){ chiudiConnessione(); salvaSessione(null); entraConCodice(codice); return; }
  }
  if(sessione){ UI.schermata='collegamento'; render(); collega(); return; }
  render();
})();
</script>
