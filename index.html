<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro dell’esplorazione</title>
<meta name="theme-color" content="#15181d">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Caratteri ospitati nel sito (licenza SIL OFL, vedi fonts/). Nessuna richiesta a Google. */
@font-face{font-family:"IM Fell English SC";src:url("fonts/im-fell-english-sc-400.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url("fonts/alegreya-sans-400.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url("fonts/alegreya-sans-400-italic.woff") format("woff");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url("fonts/alegreya-sans-500.woff") format("woff");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url("fonts/alegreya-sans-700.woff") format("woff");font-weight:700;font-style:normal;font-display:swap}
</style>
<style>
/* Layout: una colonna centrata; schede giocatori in alto, poi tracciato dei 6 livelli, stanza attiva, scelte della prossima mossa, registro. Tema scuro voluto (pietra e torcia). */
:root{
  --stone:#15181d; --slab:#1f242b; --slab2:#282e37; --line:#39404b;
  --parch:#ece3cf; --muted:#a69d8b; --torch:#dba24c; --torch-ink:#1a1408;
  --forza:#c95a40; --sapienza:#5b8fd0; --neutrale:#94a07f;
  --display:"IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--stone);color:var(--parch);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  background-image:radial-gradient(ellipse 80% 40% at 50% -10%, rgba(219,162,76,.10), transparent 70%)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem;line-height:1.1}
h2{font-size:1.3rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.hint{color:var(--muted);margin:0;font-size:.92rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--torch);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:22px}
.top .brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.logo{flex:none;width:68px;height:68px;border-radius:50%;background:var(--parch);display:grid;place-items:center;box-shadow:0 0 0 2px var(--line),0 0 24px rgba(219,162,76,.18)}
.logo img{width:80%;height:80%;object-fit:contain}
@media (max-width:480px){.logo{width:54px;height:54px}h1{font-size:1.55rem}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--slab);border-radius:8px;padding:9px 14px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--muted);background:var(--slab2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--torch);border-color:var(--torch);color:var(--torch-ink);font-weight:700}
.btn.primary:hover:not(:disabled){background:#e8b25f;border-color:#e8b25f}
.btn.big{padding:13px 20px;font-size:1.05rem}
.btn.ghost{background:transparent}
.btn.danger{border-color:#7a3a2e}

.panel{background:var(--slab);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}

/* setup */
.names{display:flex;flex-direction:column;gap:10px}
.name-row{display:flex;gap:8px;align-items:center}
.name-row .num{font-family:var(--display);color:var(--torch);width:1.6em;text-align:center;font-size:1.2rem}
.name-row input{flex:1;min-width:0;background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--parch);font:inherit}
.mods{display:flex;flex-direction:column;gap:8px}
.mod{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--stone);cursor:pointer}
.mod:has(input:checked){border-color:var(--torch)}
.mod input{accent-color:var(--torch);margin-top:5px}
.mod .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.mod strong{font-family:var(--display);font-weight:400;font-size:1.1rem}
.mod small{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:#f08a73;margin:0;font-size:.92rem}
details.fmt summary{cursor:pointer;color:var(--muted);font-size:.92rem}
details.fmt pre{background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-size:.8rem;line-height:1.4;color:var(--muted)}

a.btn{text-decoration:none;display:inline-flex;align-items:center}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--parch)}
.foot{display:flex;justify-content:center;padding-top:8px;font-size:.9rem}
.field{width:100%;background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--parch);font:inherit}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;margin-top:8px}
.narrow{max-width:420px}
.okmsg{color:var(--neutrale);margin:0;font-size:.92rem}
.mod .row{flex:none}
@media (max-width:520px){div.mod{flex-direction:column}}

.sym{display:inline-grid;place-items:center;min-width:1.35em;height:1.35em;padding:0 .2em;border-radius:50%;background:var(--parch);color:var(--stone);font-size:.78em;font-weight:700;vertical-align:.08em;margin:0 .06em}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tab{text-align:left;border:1px solid var(--line);background:var(--slab);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tab[aria-selected="true"]{border-color:var(--torch);background:var(--slab2);box-shadow:0 0 0 1px var(--torch) inset}
.tab .tn{font-weight:700;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .ts{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--line));flex:none}

/* i colori delle vie (.p-<via>) vengono dal file dell'esplorazione */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 55%,transparent);border-radius:999px;padding:2px 9px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc)}

/* track */
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.track{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.slot{flex:0 0 clamp(68px,17%,140px);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:78px;display:flex;flex-direction:column;gap:4px;background:var(--stone);text-align:left;min-width:0}
.slot .lv{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.slot .rt{font-size:.88rem;line-height:1.25;overflow-wrap:anywhere}
.slot.done{border-color:color-mix(in srgb,var(--pc) 60%,var(--line));background:color-mix(in srgb,var(--pc) 12%,var(--stone))}
.slot.done .rt{color:var(--parch)}
.slot.viewing{box-shadow:0 0 0 2px var(--pc) inset}
.slot.next{border-style:dashed;border-color:var(--torch)}
.slot.next .rt{color:var(--torch)}
.slot.empty .rt{color:var(--line)}

/* room */
.room{position:relative;background:var(--slab);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.room::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 90% at 0% 0%, color-mix(in srgb,var(--pc,var(--torch)) 16%,transparent), transparent 70%)}
.room > *{position:relative}
.room h3{font-size:1.75rem;line-height:1.15}
.room .content{max-width:65ch;margin:0}
.room.reveal .content,.room.reveal h3{animation:reveal .7s ease-out both}
.room.reveal h3{animation-duration:.45s}
@keyframes reveal{from{opacity:.0;filter:blur(6px);transform:translateY(4px)}to{opacity:1;filter:none;transform:none}}
.room.intro{--pc:var(--torch)}

/* offer */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--stone);border-radius:10px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:110px;transition:border-color .15s,background .15s,transform .15s}
.card:hover{border-color:var(--pc)}
.card[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--stone));transform:translateY(-2px)}
.card .ct{font-family:var(--display);font-size:1.25rem;line-height:1.2}
.card .badge{align-self:flex-start;margin-top:auto}
.note{border:1px dashed var(--torch);color:var(--torch);border-radius:8px;padding:10px 12px;margin:0;font-size:.95rem}
.enter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.enter-bar .sel{color:var(--muted);min-width:0}

/* log */
details.log summary{cursor:pointer;font-family:var(--display);font-size:1.15rem}
.log ol{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:flex;gap:10px;align-items:baseline;font-size:.92rem;border-bottom:1px solid var(--line);padding-bottom:6px;flex-wrap:wrap}
.log .n{color:var(--muted);font-variant-numeric:tabular-nums;width:2.2em}
.log .who{font-weight:700}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,9,11,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal .box{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
.modal .box p{margin:0;color:var(--muted)}
.modal .mact{display:flex;flex-direction:column;gap:8px}
@media (min-width:480px){.modal .mact{flex-direction:row;flex-wrap:wrap;justify-content:flex-end}}


/* ---------- telefono ---------- */
button,a,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.room{scroll-margin-top:12px}
@media (max-width:640px){
  body{font-size:15px}
  .wrap{gap:14px}
  .top{padding-top:14px;gap:10px}
  .top .actions{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .top .actions .btn{padding:8px 10px;font-size:.92rem;justify-content:center;text-align:center}
  .panel{padding:14px;gap:12px}
  h2{font-size:1.15rem}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .tab{padding:8px 10px}
  .tab .tn{font-size:1rem}
  .tab .ts{font-size:.8rem}
  .track{gap:4px}
  .slot{padding:6px 5px;min-height:64px;gap:2px}
  .slot .lv{font-size:.62rem;letter-spacing:.06em}
  .slot .rt{font-size:.74rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
  .room{padding:16px;gap:8px}
  .room h3{font-size:1.45rem}
  .cards{grid-template-columns:1fr;gap:8px}
  .card{flex-direction:row;align-items:center;justify-content:space-between;min-height:0;padding:12px 14px;gap:10px}
  .card .ct{font-size:1.1rem;min-width:0}
  .card .badge{margin-top:0;align-self:center;flex:none}
  .card[aria-pressed="true"]{transform:none}
  .enter-bar{position:sticky;bottom:0;z-index:5;margin:0 -14px -14px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));
    background:color-mix(in srgb,var(--slab) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-top:1px solid var(--line);border-radius:0 0 12px 12px;flex-wrap:nowrap}
  .enter-bar .sel{font-size:.88rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .enter-bar .btn.big{padding:11px 16px;font-size:1rem;flex:none}
}


/* regole */
.rules-box{max-width:620px;max-height:min(80vh,720px);overflow:hidden;padding:0;gap:0}
.rules-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.rules-head h2{min-width:0}
.rules-body{overflow-y:auto;padding:4px 20px 20px;overscroll-behavior:contain}
.rules-img{display:block;margin:14px auto 2px;max-height:170px;width:auto;max-width:100%}
.rules-body h3{font-size:1.15rem;color:var(--torch);margin:18px 0 6px}
.rules-body p{margin:8px 0;max-width:65ch}
.rules-body ul{margin:6px 0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.rules-body ul ul{margin-top:5px}
.rules-body strong{color:var(--parch)}
.rules-body .rules-link{margin-top:14px}
@media (max-width:640px){
  .top .actions.three{grid-template-columns:1fr 1fr 1fr}
  .top .actions .long,.slot .slot-long{display:none}
  .slot.next .rt{font-size:.68rem;overflow-wrap:normal}
  #rules.modal{padding:0;align-items:flex-end}
  .rules-box{max-height:88vh;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}


/* simulatore */
.simform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.simform label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.simsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:6px}
.simsum div{background:var(--stone);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.simsum strong{font-size:1.3rem;font-variant-numeric:tabular-nums}
.simwarn{border:1px dashed var(--torch);border-radius:8px;padding:10px 14px;color:var(--parch)}
.simwarn strong{color:var(--torch)}
.simwarn ul{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.simh{font-size:1.1rem;margin-top:8px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.simt{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.simt th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.simt td{padding:6px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:middle}
.simt .num{text-align:right;white-space:nowrap}
.simt tr.bad td{color:#f08a73}
.simt tr.warnrow td{color:var(--torch)}
details.simlv{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--stone)}
details.simlv summary{cursor:pointer;font-weight:500}
details.simlv .tablewrap{margin-top:8px}
#sim-out{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>

/* ---------- formato 2: controllo e preparazione ----------
   Scheletro fisso: ingresso → livelli → finale → ingresso.
   Il file decide vie, stanze, proposte e livello successivo. */
const RE_ID = /^[a-z0-9-]{1,40}$/, RE_KEY = /^[A-Za-z0-9_-]{1,30}$/, RE_COL = /^#[0-9a-fA-F]{6}$/;
const isObj = x => !!x && typeof x==='object' && !Array.isArray(x);
const isStr = x => typeof x==='string' && x.trim()!=='';
const has = (o,k) => Object.prototype.hasOwnProperty.call(o,k);

function validateModule(m, opts){
  opts = opts || {};
  if(!isObj(m)) return 'Il file non contiene un oggetto JSON.';
  if(m.formato!==2) return 'Il file deve indicare "formato": 2. I file nel formato precedente vanno convertiti.';
  if(typeof m.id!=='string' || !RE_ID.test(m.id)) return 'L’"id" dell’esplorazione deve contenere solo lettere minuscole, numeri e trattini.';
  if(!isStr(m.nome)) return 'L’esplorazione deve avere un "nome".';
  if(m.descrizione!=null && typeof m.descrizione!=='string') return 'La "descrizione" deve essere un testo.';
  if(m.estrazione!=null && !['casuale','meno-mostrate'].includes(m.estrazione)) return 'L’"estrazione" deve essere "casuale" oppure "meno-mostrate".';
  if(m.regole!=null && typeof m.regole!=='string') return 'Le "regole" devono essere un testo.';
  if(m.regoleLink!=null && (typeof m.regoleLink!=='string' || !/^https:\/\/\S+$/.test(m.regoleLink))) return 'Il "regoleLink" deve essere un indirizzo che inizia con https://.';
  if(m.regoleImmagine!=null && (typeof m.regoleImmagine!=='string' || !/^(img\/[a-z0-9._-]+\.(png|webp|jpg)|https:\/\/\S+)$/.test(m.regoleImmagine))) return 'La "regoleImmagine" deve essere un file in img/ o un indirizzo https://.';

  // vie
  if(!Array.isArray(m.vie) || !m.vie.length || m.vie.length>8) return 'Servono da 1 a 8 vie in "vie".';
  const vie = new Set();
  for(const v of m.vie){
    if(!isObj(v) || typeof v.id!=='string' || !RE_ID.test(v.id)) return 'Ogni via deve avere un "id" con sole lettere minuscole, numeri e trattini.';
    if(vie.has(v.id)) return `La via «${v.id}» è ripetuta.`;
    if(!isStr(v.nome)) return `La via «${v.id}» deve avere un "nome".`;
    if(v.breve!=null && !isStr(v.breve)) return `Il "breve" della via «${v.id}» deve essere un testo.`;
    if(typeof v.colore!=='string' || !RE_COL.test(v.colore)) return `Il "colore" della via «${v.id}» deve essere un colore come #c95a40.`;
    vie.add(v.id);
  }

  // livelli
  if(!isObj(m.ingresso)) return 'Manca l’"ingresso".';
  if(!isObj(m.finale)) return 'Manca il "finale".';
  if(m.livelli!=null && !isObj(m.livelli)) return 'I "livelli" devono essere un oggetto con un nome tecnico per ogni livello.';
  const livelli = m.livelli || {};
  for(const k of Object.keys(livelli)){
    if(!RE_KEY.test(k) || k==='ingresso' || k==='finale') return `Il nome tecnico di livello «${k}» non è valido: usa lettere, numeri, trattini e non usare «ingresso» o «finale».`;
  }
  const nodes = { ingresso:m.ingresso, ...livelli, finale:m.finale };
  const label = k => k==='ingresso' ? 'nell’ingresso' : k==='finale' ? 'nel finale' : `nel livello «${k}»`;
  const roomIds = new Set();
  for(const [k,n] of Object.entries(nodes)){
    if(!isObj(n)) return `Il livello «${k}» non è valido.`;
    if(n.nome!=null && !isStr(n.nome)) return `Il "nome" ${label(k)} deve essere un testo.`;
    if(!Array.isArray(n.stanze) || !n.stanze.length) return `Non ci sono stanze ${label(k)}.`;
    for(const r of n.stanze){
      if(!isObj(r) || !isStr(r.id) || !isStr(r.titolo)) return `C’è una stanza senza "id" o "titolo" ${label(k)}.`;
      if(!vie.has(r.via)) return `La stanza «${r.id}» usa la via «${r.via}», che non esiste in "vie".`;
      if(r.testo!=null && typeof r.testo!=='string') return `Il "testo" della stanza «${r.id}» deve essere un testo.`;
      if(roomIds.has(r.id)) return `L’id di stanza «${r.id}» è ripetuto: ogni stanza deve avere un id unico.`;
      roomIds.add(r.id);
    }
    if(k!=='ingresso'){
      if(!isObj(n.proposte)) return `Mancano le "proposte" ${label(k)}.`;
      for(const [da,regola] of Object.entries(n.proposte)){
        if(!vie.has(da)) return `Le "proposte" ${label(k)} citano la via «${da}», che non esiste.`;
        if(!isObj(regola)) return `La regola delle proposte ${label(k)} dopo la via «${da}» non è valida.`;
        let tot=0;
        for(const [via,num] of Object.entries(regola)){
          if(!vie.has(via)) return `Le "proposte" ${label(k)} citano la via «${via}», che non esiste.`;
          if(!Number.isInteger(num) || num<0 || num>20) return `Nelle "proposte" ${label(k)} il numero per la via «${via}» deve essere un intero tra 0 e 20.`;
          const disp = n.stanze.filter(r=>r.via===via).length;
          if(num>disp) return `Le "proposte" ${label(k)} chiedono ${num} stanze della via «${via}», ma ce ne sono solo ${disp}. Aggiungi stanze o riduci il numero.`;
          tot+=num;
        }
        if(!tot) return `Le "proposte" ${label(k)} dopo la via «${da}» non propongono nessuna stanza.`;
      }
    }
    if(k!=='finale'){
      const nx = n.successivo;
      const ok = t => t==='finale' || has(livelli,t);
      if(typeof nx==='string'){ if(!ok(nx)) return `Il "successivo" ${label(k)} punta a «${nx}», che non esiste.`; }
      else if(isObj(nx)){
        for(const [via,t] of Object.entries(nx)){
          if(!vie.has(via)) return `Il "successivo" ${label(k)} cita la via «${via}», che non esiste.`;
          if(typeof t!=='string' || !ok(t)) return `Il "successivo" ${label(k)} per la via «${via}» punta a «${t}», che non esiste.`;
        }
      } else return `Manca il "successivo" ${label(k)}.`;
    }
  }

  // percorsi: ogni strada deve arrivare al finale, senza giri a vuoto
  const nextOf = (k,via) => { const nx=nodes[k].successivo; return typeof nx==='string' ? nx : nx[via]; };
  const reached = new Set(['ingresso']);
  let err = null;
  const walk = (k, via, stack) => {
    if(err) return;
    if(stack.includes(k)){ err = `C’è un percorso che torna al livello «${k}» prima di arrivare al finale.`; return; }
    reached.add(k);
    const regola = nodes[k].proposte[via];
    if(!regola){ err = `${label(k).replace(/^./,c=>c.toUpperCase())} si può arrivare dopo una stanza della via «${via}», ma le "proposte" non dicono cosa mostrare in quel caso.`; return; }
    if(k==='finale') return;
    for(const [w,num] of Object.entries(regola)){
      if(!num) continue;
      const t = nextOf(k,w);
      if(!t){ err = `Il "successivo" ${label(k)} non dice dove si va dopo una stanza della via «${w}».`; return; }
      walk(t, w, stack.concat(k));
    }
  };
  for(const via of new Set(m.ingresso.stanze.map(r=>r.via))){
    const t = nextOf('ingresso', via);
    if(!t){ err = `Il "successivo" nell’ingresso non dice dove si va dopo una stanza della via «${via}».`; break; }
    walk(t, via, ['ingresso']);
    if(err) break;
  }
  if(err) return err;
  for(const k of Object.keys(livelli)) if(!reached.has(k)) return `Il livello «${k}» non si raggiunge da nessun percorso.`;
  if(!reached.has('finale')) return 'Nessun percorso arriva al finale.';

  if(!opts.builtin && builtins.some(b=>b.id===m.id)) return `L’id «${m.id}» è già usato da un’esplorazione inclusa nell’app.`;
  return null;
}

/* Versione interna, comoda per l'app */
function compile(src){
  const paths = {}; src.vie.forEach(v=>paths[v.id]={ label:v.nome, short:v.breve||v.nome, color:v.colore });
  const conv = r => ({ id:r.id, title:r.titolo, path:r.via, content:r.testo||'' });
  const nodes = {};
  const add = (key, n, kind) => nodes[key] = { key, name:n.nome||'', kind, rooms:n.stanze.map(conv), offer:n.proposte||null, next:key==='finale'?'ingresso':n.successivo };
  add('ingresso', src.ingresso, 'all');
  for(const [k,n] of Object.entries(src.livelli||{})) add(k, n, 'random');
  add('finale', src.finale, 'random');
  const roomMap = {}; let roomCount = 0;
  for(const n of Object.values(nodes)) for(const r of n.rooms){ roomMap[r.id] = { room:r, node:n.key }; roomCount++; }
  return { id:src.id, name:src.nome, description:src.descrizione||'', estrazione:src.estrazione||'casuale',
    rules:src.regole||'', rulesUrl:src.regoleLink||'', rulesImage:src.regoleImmagine||'',
    paths, nodes, roomMap, roomCount, levelCount:Object.keys(nodes).length, src };
}

/* ---------- storage ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const builtins = [LOWRENZIA];
// le esplorazioni caricate da file nel formato precedente non sono più valide: si scartano
let custom = (store.get('dungeon.modules') || []).filter(m=>!validateModule(m));
const _compiled = {};
function getCompiled(src){ return _compiled[src.id] && _compiled[src.id].src===src ? _compiled[src.id] : (_compiled[src.id]=compile(src)); }
const allModules = () => [...builtins, ...custom].map(getCompiled);

let S = store.get('dungeon.state') || { phase:'setup', names:['',''], moduleId:'lowrenzia', players:[], active:0, log:[], history:[] };
// partita salvata con la versione precedente: si torna alla schermata iniziale, tenendo i nomi
if(S.phase==='game' && (S.players||[]).some(p=>!p.node)){ S.phase='setup'; S.players=[]; S.history=[]; S.log=[]; }
let UI = { selected:null, view:null, justMoved:false, err:'' };
const save = () => store.set('dungeon.state', S);

function mod(){ return allModules().find(m=>m.id===S.moduleId); }
function roomInfo(id){ return mod().roomMap[id]; }

/* colori delle vie dell'esplorazione */
function applyPathColors(){
  let el = document.getElementById('path-colors');
  if(!el){ el = document.createElement('style'); el.id='path-colors'; document.head.appendChild(el); }
  const css = allModules().flatMap(m=>Object.entries(m.paths).map(([id,p])=>`.p-${id}{--pc:${p.color}}`));
  el.textContent = [...new Set(css)].join('\n');
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const sample = (a,n) => shuffle(a).slice(0,n);
const badge = p => `<span class="badge p-${esc(p)}">${esc(mod()?.paths[p]?.short||p)}</span>`;

/* ---------- regole ---------- */
/* Estrazione delle stanze proposte.
   "meno-mostrate": prima le stanze mostrate meno volte nella sessione (a chiunque),
   a parità quelle che questa persona non ha ancora visto, poi a caso.
   "casuale": estrazione semplice. Le stanze contano come mostrate appena compaiono tra le proposte. */
/* Estrazione: stessa funzione per la partita e per il simulatore.
   shown = conteggi della sessione, seen = stanze già viste da chi muove (può mancare). */
function pickRooms(m, pool, n, shown, seen){
  if(m.estrazione!=='meno-mostrate') return sample(pool, n);
  shown = shown || {}; seen = seen || {};
  return pool
    .map(r=>({ r, k1: shown[r.id]||0, k2: seen[r.id]?1:0, k3: Math.random() }))
    .sort((a,b)=> a.k1-b.k1 || a.k2-b.k2 || a.k3-b.k3)
    .slice(0, n).map(x=>x.r);
}
function drawOffer(m, nodeKey, prevPath, shown, seen){
  const node = m.nodes[nodeKey];
  if(node.kind==='all') return node.rooms.map(r=>r.id);
  const rule = node.offer[prevPath] || {};
  let out=[];
  for(const [p,n] of Object.entries(rule)) out = out.concat(pickRooms(m, node.rooms.filter(r=>r.path===p), n, shown, seen).map(r=>r.id));
  // contano come «mostrate» solo le stanze estratte (non quelle fisse dell'ingresso)
  for(const id of out){ shown[id]=(shown[id]||0)+1; if(seen) seen[id]=1; }
  return shuffle(out);
}
function genOffer(nodeKey, prevPath, player){
  S.shown = S.shown || {};
  if(player) player.seen = player.seen || {};
  return drawOffer(mod(), nodeKey, prevPath, S.shown, player ? player.seen : null);
}
const nextOfNode = (m, nodeKey, path) => { const nx = m.nodes[nodeKey].next; return typeof nx==='string' ? nx : nx[path]; };
function nextNode(nodeKey, path){ return nextOfNode(mod(), nodeKey, path); }
function newPlayer(name){ return { name, run:1, trail:[], node:'ingresso', step:1, offer:genOffer('ingresso',null,null), moves:0, seen:{} }; }

function startGame(names){
  S.shown = {}; // nuova sessione: contatori azzerati
  S.players = names.map(newPlayer); S.active=0; S.log=[]; S.history=[]; S.phase='game';
  UI = { selected:null, view:null, justMoved:false, err:'' };
  save(); render();
}
function snapshot(){ S.history.push(JSON.stringify({players:S.players, active:S.active, log:S.log, shown:S.shown||{}})); if(S.history.length>80) S.history.shift(); }

function enterRoom(){
  const p = S.players[S.active], id = UI.selected;
  if(!id || !p.offer.includes(id)) return;
  snapshot();
  if(p.node==='ingresso' && p.trail.length){ p.run++; p.trail=[]; }
  p.trail.push(id); p.moves++;
  const info = roomInfo(id);
  const next = nextNode(p.node, info.room.path);
  S.log.unshift({ player:p.name, room:info.room.title, path:info.room.path, step:p.trail.length, run:p.run });
  p.node = next;
  p.step = next==='ingresso' ? 1 : p.trail.length+1;
  p.offer = genOffer(next, info.room.path, p);
  UI.selected=null; UI.view=id; UI.justMoved=true;
  save(); render();
  const room=document.querySelector('.room');
  if(room){ const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; room.scrollIntoView({behavior:reduce?'auto':'smooth', block:'start'}); }
}
function selectPlayer(i){ S.active=i; UI.selected=null; UI.view=null; UI.justMoved=false; save(); render(); }

/* schermo sempre acceso durante la partita */
let wakeLock=null;
async function keepAwake(){
  if(S.phase!=='game' || document.visibilityState!=='visible' || wakeLock || !('wakeLock' in navigator)) return;
  try{ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); }catch(e){ wakeLock=null; }
}
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('pointerdown', keepAwake, {passive:true});

function askUndo(){
  if(!S.history.length) return;
  const last = S.log[0];
  ask({ title:'Annullare l’ultima mossa?',
    body: last ? `${last.player} tornerà indietro da «${last.room}».` : 'Lo stato tornerà a prima dell’ultima mossa.',
    actions:[ {label:'Non annullare', cls:'ghost'}, {label:'Annulla mossa', cls:'primary', fn:()=>{
      const prev = JSON.parse(S.history.pop()); S.players=prev.players; S.active=prev.active; S.log=prev.log; S.shown=prev.shown||{};
      UI.selected=null; UI.view=null; UI.justMoved=false; save(); render();
    }} ]});
}
function askReset(){
  ask({ title:'Ricominciare la partita?', body:'I progressi dell’esplorazione andranno persi.',
    actions:[
      {label:'Indietro', cls:'ghost'},
      {label:'Nuovo gruppo', cls:'danger', fn:()=>{ S.phase='setup'; S.names=['','']; S.players=[]; S.history=[]; S.log=[]; save(); render(); }},
      {label:'Stesso gruppo', cls:'primary', fn:()=> startGame(S.players.map(p=>p.name)) }
    ]});
}

/* ---------- regole dell'esplorazione ---------- */
function rulesHtml(src){
  const lines=String(src||'').split('\n'); let out='', stack=[];
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\{([A-Z0-9/]{1,3})\}/g,'<span class="sym">$1</span>');
  const closeTo=d=>{ while(stack.length>d){ out+='</li></ul>'; stack.pop(); } };
  for(const raw of lines){
    const m=raw.match(/^(\s*)- (.*)$/);
    if(m){
      const d=Math.min(Math.floor(m[1].length/2),3)+1;
      if(stack.length<d){ while(stack.length<d){ out+='<ul><li>'; stack.push(1); } }
      else { closeTo(d); out+='</li><li>'; }
      out+=inline(m[2]); continue;
    }
    closeTo(0);
    const h=raw.match(/^## (.*)$/);
    if(h) out+=`<h3>${inline(h[1])}</h3>`;
    else if(raw.trim()) out+=`<p>${inline(raw.trim())}</p>`;
  }
  closeTo(0); return out;
}
const rulesEl=document.getElementById('rules');
function openRules(m){
  if(!m) return;
  document.getElementById('r-title').textContent='Regole dell’esplorazione';
  const body=document.getElementById('r-body');
  body.innerHTML = (m.rulesImage ? `<img class="rules-img" src="${esc(m.rulesImage)}" alt="Astronauta che esplora con una torcia">` : '') + (m.rules ? rulesHtml(m.rules) : '<p class="hint">Questa esplorazione non ha ancora le regole.</p>');
  if(m.rulesUrl) body.insertAdjacentHTML('beforeend',`<p class="rules-link"><a class="link" href="${esc(m.rulesUrl)}" target="_blank" rel="noopener">Regolamento completo</a></p>`);
  body.scrollTop=0; rulesEl.hidden=false; document.getElementById('r-close').focus();
}
function closeRules(){ rulesEl.hidden=true; }
document.getElementById('r-close').onclick=closeRules;
rulesEl.addEventListener('click', e=>{ if(e.target===rulesEl) closeRules(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !rulesEl.hidden) closeRules(); });

/* ---------- import moduli ---------- */
function importFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    let m; try{ m = JSON.parse(fr.result); }catch(e){ UI.err='Il file non è un JSON valido.'; render(); return; }
    const err = validateModule(m); if(err){ UI.err=err; render(); return; }
    custom = custom.filter(c=>c.id!==m.id).concat([m]);
    store.set('dungeon.modules', custom); UI.err=''; UI.ok=`Esplorazione «${m.nome}» caricata: ora si può scegliere a inizio partita.`; save(); render();
  };
  fr.readAsText(file);
}


/* ---------- simulatore (area admin) ----------
   Gioca molte partite con scelte casuali, usando le stesse regole di estrazione dell'app. */
let simResult = null;
function simulate(m, games, nPlayers, movesEach){
  const room = {}; for(const [id,info] of Object.entries(m.roomMap)) room[id] = { shown:0, chosen:0, node:info.node };
  const viaChosen = {}, routes = {}, lapMoves = [];
  let laps = 0, moves = 0;
  for(let g=0; g<games; g++){
    const shown = {};
    const players = Array.from({length:nPlayers}, ()=>{ const seen={}; return { node:'ingresso', seen, route:['ingresso'], lapStart:0, made:0, offer:drawOffer(m,'ingresso',null,shown,seen) }; });
    // ordine libero: a ogni mossa tocca a una persona a caso che ha ancora mosse
    const left = players.map(()=>movesEach);
    for(let t=0; t<nPlayers*movesEach; t++){
      const cand = left.map((l,i)=>l>0?i:-1).filter(i=>i>=0);
      const i = cand[Math.floor(Math.random()*cand.length)]; left[i]--;
      const p = players[i];
      const id = p.offer[Math.floor(Math.random()*p.offer.length)];
      const r = m.roomMap[id].room;
      room[id].chosen++; viaChosen[r.path] = (viaChosen[r.path]||0)+1; moves++; p.made++;
      const from = p.node, to = nextOfNode(m, from, r.path);
      if(from==='finale'){
        laps++; lapMoves.push(p.made - p.lapStart); p.lapStart = p.made;
        const key = p.route.join('>'); routes[key] = (routes[key]||0)+1; p.route = ['ingresso'];
      } else p.route.push(to);
      p.node = to;
      p.offer = drawOffer(m, to, r.path, shown, p.seen);
      for(const x of p.offer) room[x].shown++;   // per l'ingresso non conta: non compare nelle tabelle
    }
  }
  return { m, games, nPlayers, movesEach, room, viaChosen, routes, laps, moves, lapMoves };
}
function simHtml(R){
  const m = R.m, pct = (a,b) => b ? (100*a/b).toFixed(1).replace('.',',')+'%' : '—';
  const nodeName = k => k==='ingresso' ? (m.nodes.ingresso.name||'Ingresso') : k==='finale' ? (m.nodes.finale.name||'Finale') : (m.nodes[k].name ? `${m.nodes[k].name} (${k})` : k);
  const avgLap = R.lapMoves.length ? (R.lapMoves.reduce((a,b)=>a+b,0)/R.lapMoves.length).toFixed(1).replace('.',',') : '—';
  const totalChosen = Object.values(R.viaChosen).reduce((a,b)=>a+b,0);
  const vieRows = Object.keys(m.paths).map(v=>`<tr><td>${badge(v)}</td><td class="num">${R.viaChosen[v]||0}</td><td class="num">${pct(R.viaChosen[v]||0,totalChosen)}</td></tr>`).join('');
  const routeRows = Object.entries(R.routes).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${k.split('>').map(x=>esc(nodeName(x))).join(' → ')}</td><td class="num">${pct(n,R.laps)}</td></tr>`).join('') || '<tr><td colspan="2" class="hint">Nessun giro completato: prova ad aumentare le mosse a testa.</td></tr>';
  const warn = [];
  const nodeBlocks = Object.values(m.nodes).filter(n=>n.kind!=='all').map(n=>{
    const rows = n.rooms.map(r=>({ r, ...R.room[r.id] }));
    const avg = rows.reduce((a,x)=>a+x.shown,0)/rows.length;
    rows.forEach(x=>{ if(x.shown===0) warn.push(`«${x.r.title}» (${nodeName(n.key)}) non è mai stata proposta.`); else if(avg && x.shown < avg*0.5) warn.push(`«${x.r.title}» (${nodeName(n.key)}) è stata proposta meno della metà della media del livello.`); });
    const body = rows.sort((a,b)=>b.shown-a.shown).map(x=>`<tr class="${x.shown===0?'bad':(avg && x.shown<avg*0.5?'warnrow':'')}"><td>${esc(x.r.title)}</td><td>${badge(x.r.path)}</td><td class="num">${x.shown}</td><td class="num">${x.chosen}</td><td class="num">${pct(x.chosen,x.shown)}</td></tr>`).join('');
    return `<details class="simlv"><summary>${esc(nodeName(n.key))} · ${n.rooms.length} stanze</summary><div class="tablewrap"><table class="simt"><thead><tr><th>Stanza</th><th>Via</th><th class="num">Proposta</th><th class="num">Scelta</th><th class="num">Scelta se proposta</th></tr></thead><tbody>${body}</tbody></table></div></details>`;
  }).join('');
  return `
    <div class="simsum">
      <div><span class="eyebrow">Partite</span><strong>${R.games.toLocaleString('it-IT')}</strong></div>
      <div><span class="eyebrow">Mosse</span><strong>${R.moves.toLocaleString('it-IT')}</strong></div>
      <div><span class="eyebrow">Giri completati</span><strong>${R.laps.toLocaleString('it-IT')}</strong></div>
      <div><span class="eyebrow">Mosse per un giro</span><strong>${avgLap}</strong></div>
    </div>
    ${warn.length ? `<div class="simwarn"><strong>Da controllare</strong><ul>${warn.slice(0,12).map(w=>`<li>${esc(w)}</li>`).join('')}${warn.length>12?`<li>…e altre ${warn.length-12}.</li>`:''}</ul></div>` : `<p class="okmsg">Tutte le stanze sono state proposte in modo equilibrato.</p>`}
    <h3 class="simh">Vie scelte</h3>
    <div class="tablewrap"><table class="simt"><thead><tr><th>Via</th><th class="num">Scelte</th><th class="num">Quota</th></tr></thead><tbody>${vieRows}</tbody></table></div>
    <h3 class="simh">Percorsi dei giri completati</h3>
    <div class="tablewrap"><table class="simt"><thead><tr><th>Percorso</th><th class="num">Quota</th></tr></thead><tbody>${routeRows}</tbody></table></div>
    <h3 class="simh">Stanze per livello</h3>
    ${nodeBlocks}
    <p class="hint">Le scelte del simulatore sono casuali: non sa quali stanze preferirebbero le persone al tavolo. Serve a scoprire stanze che escono poco, percorsi rari e pool sbilanciati.</p>`;
}
/* ---------- render ---------- */

  S.phase==='game' ? renderGame() : renderSetup();
}

/* ---------- area admin ---------- */
const DEFAULT_PW = 'dungeon';
let adminOk = false; try{ adminOk = sessionStorage.getItem('dungeon.admin')==='1'; }catch(e){}
async function hashPw(pw){
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('registro-dungeon:'+pw));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return 'plain:'+pw; }
}
async function checkPw(pw){ const saved = store.get('dungeon.pw'); return saved ? (await hashPw(pw))===saved : pw===DEFAULT_PW; }
function setAdmin(v){ adminOk=v; try{ v?sessionStorage.setItem('dungeon.admin','1'):sessionStorage.removeItem('dungeon.admin'); }catch(e){} }

function renderLogin(){
  app.innerHTML = `
  <header class="top">${brand('Area admin','Registro dell’esplorazione')}</header>
  <form class="panel narrow" id="login">
    <div><h2>Accesso</h2><p class="hint">Inserisci la password per gestire le esplorazioni.</p></div>
    <input type="password" id="pw" class="field" autocomplete="current-password" placeholder="Password" required>
    ${UI.err?`<p class="err">${esc(UI.err)}</p>`:''}
    <div class="row"><button class="btn primary" type="submit">Entra</button><a href="#" class="link">Torna alla partita</a></div>
  </form>`;
  const pw=document.getElementById('pw'); pw.focus();
  document.getElementById('login').onsubmit = async e => {
    e.preventDefault();
    if(await checkPw(pw.value)){ setAdmin(true); UI.err=''; render(); }
    else { UI.err='Password errata.'; render(); }
  };
}

  </header>
  <section class="panel">
    <div><h2>Esplorazioni caricate</h2><p class="hint">Sono quelle che si possono scegliere a inizio partita.</p></div>
    <div class="mods">${allModules().map(m=>`
      <div class="mod"><span class="meta"><strong>${esc(m.name)}</strong>
        <small>${m.description?esc(m.description)+' · ':''}${m.levelCount} livelli · ${m.roomCount} stanze${builtins.includes(m.src)?' · inclusa nell’app':''}</small></span>
        <div class="row"><button class="btn ghost" data-copy="${esc(m.id)}">Copia JSON</button>

  </section>
  <section class="panel">
    <div><h2>Simulatore</h2><p class="hint">Gioca tante partite con scelte casuali e le stesse regole dell’app, per controllare il bilanciamento di un’esplorazione prima di portarla al tavolo.</p></div>
    <div class="simform">
      <label>Esplorazione<select id="sim-mod" class="field">${allModules().map(m=>`<option value="${esc(m.id)}" ${simResult&&simResult.m.id===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
      <label>Partite<select id="sim-games" class="field">${[100,1000,5000].map(n=>`<option ${n===(simResult?simResult.games:1000)?'selected':''}>${n}</option>`).join('')}</select></label>
      <label>Esplorator*<select id="sim-players" class="field">${[2,3,4].map(n=>`<option ${n===(simResult?simResult.nPlayers:4)?'selected':''}>${n}</option>`).join('')}</select></label>
      <label>Mosse a testa<input id="sim-moves" class="field" type="number" min="1" max="60" value="${simResult?simResult.movesEach:10}"></label>
    </div>
    <div><button class="btn primary" id="sim-run">Simula</button></div>
    <div id="sim-out" aria-live="polite">${simResult?simHtml(simResult):''}</div>
  </section>
  <section class="panel">
    <div><h2>Carica una nuova esplorazione</h2><p class="hint">File JSON nel formato 2, con vie, livelli e stanze. «Copia JSON» su un’esplorazione esistente ti dà un modello da cui partire. Il file viene controllato al caricamento: se qualcosa non torna, ti dice cosa correggere.</p></div>
    <div class="row"><button class="btn primary" id="imp">Scegli file…</button><input type="file" id="file" accept=".json,application/json" hidden></div>
    ${UI.err?`<p class="err">${esc(UI.err)}</p>`:''}
    ${UI.ok?`<p class="okmsg">${esc(UI.ok)}</p>`:''}
    <details class="fmt"><summary>Formato del file</summary>
<p class="hint">Campi principali: "formato": 2, "id", "nome", "vie" (id, nome, breve, colore), "ingresso" (stanze e successivo), "livelli" (stanze, proposte, successivo), "finale" (stanze e proposte). Ogni stanza ha id, titolo, via e testo. Facoltativi: "descrizione", "estrazione" ("meno-mostrate" o "casuale"), "regole", "regoleLink", "regoleImmagine".</p>
<p class="hint"><a class="link" href="https://github.com/artenaut/esplorazione/blob/main/docs/formato-esplorazione.md" target="_blank" rel="noopener">Guida completa al formato, con esempi</a></p></details>
  </section>
  <form class="panel" id="pwform">
    <div><h2>Cambia password</h2><p class="hint">La password vale per questo browser.</p></div>
    <input type="password" id="pw-new" class="field" autocomplete="new-password" placeholder="Nuova password" minlength="4" required>
    <input type="password" id="pw-rep" class="field" autocomplete="new-password" placeholder="Ripeti la nuova password" minlength="4" required>
    <p class="hint" id="pw-msg" aria-live="polite"></p>
    <div><button class="btn" type="submit">Salva password</button></div>
  </form>`;

  document.getElementById('logout').onclick=()=>{ setAdmin(false); location.hash=''; render(); };
  app.querySelectorAll('[data-delmod]').forEach(b=>b.onclick=()=>{
    const m = allModules().find(x=>x.id===b.dataset.delmod);
    ask({ title:`Rimuovere «${m.name}»?`, body:'Non si potrà più scegliere a inizio partita. Una partita in corso con questa esplorazione verrà chiusa.',
      actions:[{label:'Indietro',cls:'ghost'},{label:'Rimuovi',cls:'primary',fn:()=>{
        custom=custom.filter(c=>c.id!==m.id); store.set('dungeon.modules',custom);
        if(S.moduleId===m.id){ S.moduleId=builtins[0].id; if(S.phase==='game'){ S.phase='setup'; S.players=[]; S.history=[]; S.log=[]; } }
        UI.ok=`Esplorazione «${m.name}» rimossa.`; UI.err=''; save(); render();
      }}]});
  });
  app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{
    const m = allModules().find(x=>x.id===b.dataset.copy), txt = JSON.stringify(m.src,null,2), msg=document.getElementById('copy-msg');
    navigator.clipboard.writeText(txt).then(()=>{ msg.textContent=`JSON di «${m.name}» copiato negli appunti.`; })
      .catch(()=>{ msg.innerHTML=`Copia non riuscita: seleziona il testo qui sotto.<textarea class="field mono" rows="8" readonly>${esc(txt)}</textarea>`; msg.querySelector('textarea').select(); });
  });

  };
}

function bindSetup(){
  app.querySelectorAll('.name-row input').forEach(inp=>inp.addEventListener('input',e=>{ S.names[+e.target.dataset.i]=e.target.value; save(); }));
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ S.names.splice(+b.dataset.rm,1); save(); render(); });
  const add=document.getElementById('add'); if(add) add.onclick=()=>{ S.names.push(''); save(); render(); document.getElementById('name-'+(S.names.length-1)).focus(); };
  app.querySelectorAll('input[name=mod]').forEach(r=>r.onchange=()=>{ S.moduleId=r.value; save(); });
  document.getElementById('rules-btn').onclick=()=>openRules(mod());
  document.getElementById('start').onclick=()=>{
    const names=S.names.map(n=>n.trim()); const errEl=document.getElementById('start-err');
    let msg='';
    if(names.some(n=>!n)) msg='Inserisci il nome di ogni esplorator*, oppure rimuovi le righe vuote.';
    else if(new Set(names.map(n=>n.toLowerCase())).size!==names.length) msg='Due nomi sono uguali: rendili distinguibili.';
    if(msg){ errEl.textContent=msg; errEl.hidden=false; return; }
    startGame(names);
  };
}

function renderGame(){
  const m = mod(), P = S.players, p = P[S.active];
  const finished = p.node==='ingresso' && p.trail.length>0;   // ha appena chiuso un giro
  const viewId = p.trail[p.trail.length-1];
  const view = viewId ? roomInfo(viewId) : null;
  const showText = UI.justMoved && UI.view===viewId; // il testo si vede solo subito dopo l'ingresso

  const tabs = P.map((q,i)=>{
    const cur = q.trail.length ? roomInfo(q.trail[q.trail.length-1]) : null;
    const qDone = q.node==='ingresso' && q.trail.length>0;
    const where = !cur ? 'All’ingresso' : qDone ? 'Esplorazione completata' : `Passo ${q.trail.length}`;
    return `<button class="tab ${cur?'p-'+cur.room.path:''}" role="tab" aria-selected="${i===S.active}" data-tab="${i}">
      <span class="tn">${esc(q.name)}</span><span class="ts"><span class="dot"></span>${where} · giro ${q.run}</span></button>`;
  }).join('');

  // solo i passi fatti e il prossimo: la lunghezza totale del percorso resta nascosta
  let slots = p.trail.map((id,i)=>{ const r=roomInfo(id).room;
    return `<div class="slot done p-${r.path} ${id===viewId?'viewing':''}"><span class="lv">Passo ${i+1}</span><span class="rt">${esc(r.title)}</span></div>`; }).join('');
  if(!finished) slots += `<div class="slot next"><span class="lv">Passo ${p.step}</span><span class="rt">Prossima<span class="slot-long"> mossa</span></span></div>`;

  const roomHtml = view ? `
    <section class="room p-${view.room.path} ${showText?'reveal':''}" aria-live="polite">
      <div class="row"><span class="eyebrow">${esc(stepLabel(p.trail.length, view.node))}</span>${badge(view.room.path)}</div>
      <h3>${esc(view.room.title)}</h3>
      ${showText?`<p class="content">${rich(view.room.content||'')}</p>`:`<p class="content hint">Stanza attuale di ${esc(p.name)}. L’effetto si legge solo al momento dell’ingresso.</p>`}
    </section>` : `
    <section class="room intro">
      <span class="eyebrow">Giro ${p.run}</span>
      <h3>${esc(p.name)} è davanti all’ingresso</h3>
      <p class="content">Scegli quale via imboccare. Il contenuto di ogni stanza si rivela solo quando ci entri.</p>
    </section>`;

  const offerHtml = `
    <section class="panel">
      <div class="sec-head"><h2>Prossima mossa · ${esc(stepLabel(p.step, p.node))}</h2><span class="hint">${p.offer.length} ${p.offer.length===1?'stanza disponibile':'stanze tra cui scegliere'}</span></div>
      ${finished?`<p class="note">${esc(p.name)} ha completato l’esplorazione. La prossima mossa riporta all’ingresso e apre il giro ${p.run+1}.</p>`:''}
      <div class="cards">${p.offer.map(id=>{ const r=roomInfo(id).room;
        return `<button class="card p-${r.path}" aria-pressed="${UI.selected===id}" data-pick="${esc(id)}"><span class="ct">${esc(r.title)}</span>${badge(r.path)}</button>`; }).join('')}</div>
      <div class="enter-bar"><span class="sel">${UI.selected?`Scelta: <strong>${esc(roomInfo(UI.selected).room.title)}</strong>`:'Seleziona una stanza.'}</span>
        <button class="btn primary big" id="enter" ${UI.selected?'':'disabled'}>Entra nella stanza</button></div>
    </section>`;

  const logHtml = `
    <details class="log panel"><summary>Registro delle mosse (${S.log.length})</summary>
      ${S.log.length?`<ol>${S.log.slice(0,60).map((e,i)=>`<li><span class="n">${S.log.length-i}.</span><span class="who">${esc(e.player)}</span><span>${esc(e.room)}</span>${badge(e.path)}<span class="hint">passo ${e.step ?? e.level} · giro ${e.run}</span></li>`).join('')}</ol>`:'<p class="hint" style="margin-top:10px">Nessuna mossa ancora.</p>'}
    </details>`;

  app.innerHTML = `
  <header class="top">
    ${brand(m.name,'Registro dell’esplorazione')}
    <div class="actions three"><button class="btn" id="rules-btn">Regole</button><button class="btn" id="undo" ${S.history.length?'':'disabled'}>Annulla<span class="long"> ultima mossa</span></button><button class="btn danger" id="reset">Ricomincia</button></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Esplorator*">${tabs}</nav>
  <section class="panel">
    <div class="sec-head"><h2>Percorso di ${esc(p.name)}</h2><span class="hint">Giro ${p.run} · ${p.moves} ${p.moves===1?'mossa':'mosse'} in totale</span></div>
    <div class="track">${slots}</div>
  </section>
  ${roomHtml}
  ${offerHtml}
  ${logHtml}`;

  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>selectPlayer(+b.dataset.tab));
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ UI.selected = UI.selected===b.dataset.pick?null:b.dataset.pick; render(); });
  document.getElementById('enter').onclick=enterRoom;
  document.getElementById('undo').onclick=askUndo;
  document.getElementById('reset').onclick=askReset;
  document.getElementById('rules-btn').onclick=()=>openRules(mod());
}

render();
</script>
